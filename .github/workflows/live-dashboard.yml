# Publishes the public track-record dashboard with live account data.
#
# Why this runs in CI rather than in the page:
# the Alpaca key must never reach the browser. An API key in page source is
# readable by every visitor, and Alpaca keys can place and cancel orders, not
# merely read state. Here the key lives in repository secrets, is used only by
# scripts/fetch_live_data.py, and only sanitised read-only output (balances,
# positions, price history) is ever published.
#
# Deployment is via the Pages *artifact* mechanism, not a branch commit, so
# refreshing the dashboard every few minutes adds zero commits to main and the
# research history stays readable.

name: Live dashboard

on:
  schedule:
    # Every 5 minutes during US market hours -- GitHub's cron floor. Actions
    # cron is also best-effort and can run late under load, so the page treats
    # the feed's own timestamp as truth rather than assuming this cadence.
    # 13:30-21:00 UTC covers 09:30-16:00 ET in EDT; the extra hour covers EST
    # after the November clock change.
    - cron: "*/5 13,14,15,16,17,18,19,20,21 * * 1-5"
    # Once more after the close, so the page settles on final daily figures.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # manual trigger, for testing
  push:
    branches: [main]
    paths:
      - "docs/dashboard.html"
      - "docs/index.html"
      - "scripts/fetch_live_data.py"
      - ".github/workflows/live-dashboard.yml"

# Never let two deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch live account data
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          LIVE_JSON_PATH: _site/live.json
        run: python scripts/fetch_live_data.py

      - name: Assemble site
        run: |
          cp docs/dashboard.html _site/index.html
          # Keep the static journal-derived page reachable as a fallback for
          # anyone who wants the non-JavaScript version.
          if [ -f docs/index.html ]; then cp docs/index.html _site/static.html; fi
          ls -la _site

      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..6}; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=github-pages \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become visible for this run."
          exit 1

      - id: deploy
        uses: actions/deploy-pages@v4
